name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Template state
        run: python scripts/cadctl.py check
      - name: Example project
        shell: bash
        run: |
          S="--state examples/MB001-wall-bracket/workflow-state.json"
          python scripts/cadctl.py $S check
          python scripts/cadctl.py $S bom | grep -q "MB001-01"
          python scripts/cadctl.py $S next | grep -q "G1"

  openscad:
    # The OpenSCAD example model must build on all three systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenSCAD (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y openscad
          echo "SCAD=openscad" >> "$GITHUB_ENV"
      - name: Install OpenSCAD (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install openscad -y --no-progress
          echo "SCAD=/c/Program Files/OpenSCAD/openscad.com" >> "$GITHUB_ENV"
      - name: Install OpenSCAD (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask openscad@snapshot  # stable cask disabled by Homebrew (2026-09)
          echo "SCAD=/Applications/OpenSCAD.app/Contents/MacOS/OpenSCAD" >> "$GITHUB_ENV"
      - name: Build example STL
        shell: bash
        run: |
          "$SCAD" -o MB001-R01.stl examples/MB001-wall-bracket/cad/mb001_bracket.scad
          test -s MB001-R01.stl

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          # raw.githubusercontent links in llms.txt are checked by the unit tests
          args: --no-progress --exclude 'raw\.githubusercontent\.com/d0ukan/cad-for-anything' './**/*.md' llms.txt
          fail: true
