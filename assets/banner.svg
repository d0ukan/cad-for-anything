<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="CAD for Anything">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2742"/><stop offset="1" stop-color="#1d4f7a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <!-- isometric L-bracket -->
  <g transform="translate(880 40)" stroke="#0f2742" stroke-width="2" stroke-linejoin="round">
    <polygon points="40,60 140,10 240,60 140,110" fill="#7fc4f5"/>
    <polygon points="40,60 140,110 140,126 40,76" fill="#3b8fd0"/>
    <polygon points="140,110 240,60 240,76 140,126" fill="#2a6fa8"/>
    <polygon points="140,110 240,60 240,200 140,250" fill="#5aa9e6"/>
    <polygon points="140,110 140,250 124,242 124,118" fill="#2a6fa8"/>
    <ellipse cx="190" cy="140" rx="12" ry="16" fill="#0f2742"/>
    <ellipse cx="190" cy="205" rx="12" ry="16" fill="#0f2742"/>
    <ellipse cx="110" cy="62" rx="16" ry="9" fill="#0f2742"/>
  </g>
  <g stroke="#ffcc4d" stroke-width="2" fill="none" opacity="0.9">
    <path d="M1135 100 V250"/><path d="M1127 100 H1143"/><path d="M1127 250 H1143"/>
  </g>
  <text x="1150" y="180" fill="#ffcc4d" font-family="Consolas, monospace" font-size="16">100</text>
  <text x="60" y="120" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700">CAD for Anything</text>
  <text x="62" y="168" fill="#cfe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Design mechanical parts with any AI and any CAD program</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0f2742" font-weight="600">
    <rect x="62" y="200" width="110" height="36" rx="18" fill="#ffcc4d"/><text x="77" y="224">3D print</text>
    <rect x="184" y="200" width="60" height="36" rx="18" fill="#ffcc4d"/><text x="199" y="224">CNC</text>
    <rect x="256" y="200" width="140" height="36" rx="18" fill="#ffcc4d"/><text x="271" y="224">Sheet metal</text>
    <rect x="408" y="200" width="90" height="36" rx="18" fill="#ffcc4d"/><text x="423" y="224">Any AI</text>
    <rect x="510" y="200" width="100" height="36" rx="18" fill="#ffcc4d"/><text x="525" y="224">Any CAD</text>
  </g>
</svg>
